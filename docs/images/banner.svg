      <stop offset="0" stop-color="#04060d"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe7ff"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.8" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="0.45" stop-color="#0e2a55"/>
      <stop offset="1" stop-color="#050b1c"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#39d0ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="orbit" d="M -270 0 A 270 70 0 1 1 270 0 A 270 70 0 1 1 -270 0 Z"/>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#nebula)"/>

